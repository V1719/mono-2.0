name: Build Mono2.0 debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate the Gradle project root
        id: locate
        run: |
          set -e
          FOUND=$(find . -maxdepth 3 -name settings.gradle.kts | head -n 1)
          if [ -z "$FOUND" ]; then
            echo "Could not find settings.gradle.kts anywhere in the repo." >&2
            exit 1
          fi
          DIR=$(dirname "$FOUND")
          echo "Found project root: $DIR"
          echo "root=$DIR" >> "$GITHUB_OUTPUT"

      - name: Generate the Gradle wrapper
        working-directory: ${{ steps.locate.outputs.root }}
        run: gradle wrapper --gradle-version 9.4.1

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.root }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mono-debug-apk
          path: ${{ steps.locate.outputs.root }}/app/build/outputs/apk/debug/app-debug.apk
